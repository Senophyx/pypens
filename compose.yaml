services:
  pens-api:
    container_name: pens-api
    restart: unless-stopped
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/astral-sh/uv:python3.11-bookworm-slim
        ENV UV_PROJECT_ENVIRONMENT="/opt/venv"
        ENV PATH="/opt/venv/bin:$PATH"
        WORKDIR /app
        COPY pyproject.toml uv.lock ./
        COPY README.md ./
        COPY server.py ./
        COPY pypens ./pypens
        RUN uv sync --frozen --extra server
        EXPOSE 8000
        CMD ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]

    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./server.py:/app/server.py
      - ./pypens:/app/pypens
      - ./users:/app/users

    ports:
      - "2003:8000"
